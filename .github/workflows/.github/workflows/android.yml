name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/joy/browser
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JoyBrowser"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.joy.browser'
              compileSdk 34
              defaultConfig {
                  applicationId "com.joy.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.joy.browser">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="JOY Browser" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content">
                  <EditText android:id="@+id/urlInput" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:hint="URL"/>
                  <Button android:id="@+id/goBtn" android:text="Go" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              </LinearLayout>
              <LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content">
                  <Button android:id="@+id/backBtn" android:text="Back"/>
                  <Button android:id="@+id/refreshBtn" android:text="Refresh"/>
              </LinearLayout>
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/joy/browser/MainActivity.kt
          package com.joy.browser
          import android.os.Bundle
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              lateinit var webView: WebView
              lateinit var urlInput: EditText
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  webView = findViewById(R.id.webView)
                  urlInput = findViewById(R.id.urlInput)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("https://www.google.com")
                  findViewById<Button>(R.id.goBtn).setOnClickListener {
                      var url = urlInput.text.toString()
                      if (!url.startsWith("http")) url = "https://$url"
                      webView.loadUrl(url)
                  }
                  findViewById<Button>(R.id.backBtn).setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                  findViewById<Button>(R.id.refreshBtn).setOnClickListener { webView.reload() }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyBrowserAPK
          path: app/build/outputs/apk/debug/app-debug.apk
